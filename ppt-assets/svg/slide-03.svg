<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/><stop offset=".38" stop-color="#6d28d9"/>
      <stop offset=".72" stop-color="#0f766e"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8b99"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .m{font-family:Consolas,monospace}
      .kicker{font-family:"Microsoft YaHei",sans-serif;font-size:17px;font-weight:500;fill:#8a8a97;letter-spacing:4px}
      .h1{font-family:"Microsoft YaHei",sans-serif;font-size:54px;font-weight:700;fill:#131317;letter-spacing:-1px}
      .sub{font-family:Consolas,monospace;font-size:19px;fill:#8a8a97}
      .lane{font-family:"Microsoft YaHei",sans-serif;font-size:20px;font-weight:700;fill:#131317}
      .lanel{font-family:Consolas,monospace;font-size:14px;fill:#8a8a97}
      .msg{font-family:Consolas,monospace;font-size:17px;fill:#3d3d47}
      .ov{font-family:"Microsoft YaHei",sans-serif;font-size:16px;font-weight:700;fill:#b45309}
      .foot{font-family:Consolas,monospace;font-size:16px;fill:#9a9aa8}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="6" fill="url(#top)"/>

  <text class="kicker" x="96" y="96">PLANE M · FUNCTION CALLING ROUND-TRIP</text>
  <text class="h1" x="96" y="158">Plane M 时序：模型平面的三次越权</text>
  <text class="sub" x="96" y="196">流越权 · 状态越权 · 推理越权 —— 工具对流 / 状态 / 推理层的额外权限</text>

  <!-- lanes -->
  <g>
    <rect x="40" y="240" width="260" height="64" rx="9" fill="#f3f5f8" stroke="#d5dce6"/>
    <text class="lane" x="170" y="268" text-anchor="middle">Client</text>
    <text class="lanel" x="170" y="292" text-anchor="middle">useChat · SSE</text>

    <rect x="350" y="240" width="260" height="64" rx="9" fill="#fff8ea" stroke="#f4dcae"/>
    <text class="lane" x="480" y="268" text-anchor="middle" fill="#7c3f06">Route · Stream</text>
    <text class="lanel" x="480" y="292" text-anchor="middle">POST /api/chat</text>

    <rect x="670" y="240" width="260" height="64" rx="9" fill="#f5f1ff" stroke="#ddd0fb"/>
    <text class="lane" x="800" y="268" text-anchor="middle" fill="#4c1d95">streamText</text>
    <text class="lanel" x="800" y="292" text-anchor="middle">AI SDK v7</text>

    <rect x="980" y="240" width="260" height="64" rx="9" fill="#f5f1ff" stroke="#ddd0fb"/>
    <text class="lane" x="1110" y="268" text-anchor="middle" fill="#4c1d95">Tool Registry</text>
    <text class="lanel" x="1110" y="292" text-anchor="middle">8 descriptors</text>

    <rect x="1290" y="240" width="260" height="64" rx="9" fill="#eefbf8" stroke="#bfe9e2"/>
    <text class="lane" x="1420" y="268" text-anchor="middle" fill="#0b5d56">Adapter</text>
    <text class="lanel" x="1420" y="292" text-anchor="middle">execute()</text>

    <rect x="1590" y="240" width="290" height="64" rx="9" fill="#ffffff" stroke="#e2e2e8"/>
    <text class="lane" x="1735" y="268" text-anchor="middle">Model / IO</text>
    <text class="lanel" x="1735" y="292" text-anchor="middle">DeepSeek · HTTP · DB</text>
  </g>

  <g stroke="#dcdce4" stroke-width="1.5" stroke-dasharray="5 7">
    <line x1="170" y1="304" x2="170" y2="972"/>
    <line x1="480" y1="304" x2="480" y2="972"/>
    <line x1="800" y1="304" x2="800" y2="972"/>
    <line x1="1110" y1="304" x2="1110" y2="972"/>
    <line x1="1420" y1="304" x2="1420" y2="972"/>
    <line x1="1735" y1="304" x2="1735" y2="972"/>
  </g>

  <!-- messages -->
  <g>
    <line x1="170" y1="356" x2="466" y2="356" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="184" y="348">POST /api/chat { id, message }</text>

    <line x1="480" y1="402" x2="786" y2="402" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="494" y="394">streamText({ tools })</text>

    <line x1="800" y1="448" x2="1721" y2="448" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="814" y="440">chat/completions · tools[] (JSON Schema)</text>

    <line x1="1735" y1="494" x2="814" y2="494" stroke="#8b8b99" stroke-width="1.4" marker-end="url(#m2)"/>
    <text class="msg" x="1000" y="486">tool_calls[ { name, arguments } ]</text>

    <line x1="800" y1="540" x2="1096" y2="540" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="814" y="532">resolve(name) · zod 校验</text>

    <line x1="1110" y1="586" x2="1406" y2="586" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="1124" y="578">execute(parsed, ctx)</text>

    <line x1="1420" y1="632" x2="1721" y2="632" stroke="#b45309" stroke-width="1.6" marker-end="url(#m3)"/>
    <text class="ov" x="1434" y="624">越权① 写流</text>

    <line x1="1420" y1="678" x2="1721" y2="678" stroke="#b45309" stroke-width="1.6" marker-end="url(#m3)"/>
    <text class="ov" x="1434" y="670">越权② 落库 / Blob</text>

    <line x1="1420" y1="724" x2="1721" y2="724" stroke="#b45309" stroke-width="1.6" marker-end="url(#m3)"/>
    <text class="ov" x="1434" y="716">越权③ 二次生成</text>

    <line x1="1420" y1="780" x2="1124" y2="780" stroke="#8b8b99" stroke-width="1.4" marker-end="url(#m2)"/>
    <text class="msg" x="1160" y="772">tool result (JSON)</text>

    <line x1="1110" y1="826" x2="814" y2="826" stroke="#8b8b99" stroke-width="1.4" marker-end="url(#m2)"/>
    <text class="msg" x="850" y="818">tool-result part</text>

    <line x1="800" y1="880" x2="1721" y2="880" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#m1)"/>
    <text class="msg" x="814" y="872">回灌 · messages += tool-result（多步循环 → stop）</text>

    <line x1="800" y1="934" x2="494" y2="934" stroke="#8b8b99" stroke-width="1.4" marker-end="url(#m2)"/>
    <text class="msg" x="520" y="926">toUIMessageStream()</text>

    <line x1="480" y1="972" x2="184" y2="972" stroke="#8b8b99" stroke-width="1.4" marker-end="url(#m2)"/>
    <text class="msg" x="210" y="964">SSE：text-delta / data-*</text>
  </g>

  <text class="foot" x="96" y="1016">三类越权：createDocument 直写 dataStream · requestSuggestions / grabImage 直落库与 Blob · 文档类工具内嵌 streamText</text>
  <text class="foot" x="1824" y="1016" text-anchor="end">FIG 03 / 06</text>
</svg>
